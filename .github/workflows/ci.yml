name: CI

on:
  push:
    branches: [main, "work/**", "fix/**", "feature/**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src adapters tests examples
      - name: Unit tests
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Raise vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start OpenSearch
        run: docker compose up -d --wait --wait-timeout 300
      - name: Wait until OpenSearch responds
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9200 >/dev/null; then
              echo "OpenSearch is ready"
              exit 0
            fi
            sleep 2
          done
          echo "OpenSearch did not become ready"
          curl -sv http://localhost:9200 || true
          docker compose logs || true
          exit 1
      - name: Integration tests
        run: RUN_INTEGRATION=1 OPENSEARCH_URL=http://localhost:9200 pytest -m integration -q
      - name: Tear down
        if: always()
        run: docker compose down -v
