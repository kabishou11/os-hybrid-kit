[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "os-hybrid-kit"
version = "0.5.2"
description = "Portable OpenSearch hybrid search (BM25 + kNN + RRF / weighted normalization) with a thin Dify adapter and optional LangChain / LlamaIndex retrievers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zhu Lei", email = "woicyou@gmail.com" }]
requires-python = ">=3.10"
keywords = ["opensearch", "hybrid-search", "bm25", "knn", "rrf", "dify", "langchain", "llama-index"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "opensearch-py>=2.6,<4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
dify = []
langchain = ["langchain-core>=0.2"]
llama-index = ["llama-index-core>=0.10"]

[project.urls]
Homepage = "https://github.com/kabishou11/os-hybrid-kit"
Issues = "https://github.com/kabishou11/os-hybrid-kit/issues"
Changelog = "https://github.com/kabishou11/os-hybrid-kit/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["os_hybrid_kit", "os_hybrid_kit.integrations", "adapters", "adapters.dify"]

[tool.setuptools.package-dir]
os_hybrid_kit = "src/os_hybrid_kit"
adapters = "adapters"

[tool.setuptools.package-data]
os_hybrid_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live OpenSearch cluster",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "adapters", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
